  </style>
  <circle class="ring" cx="50" cy="50" r="37" stroke-width="4" opacity="0.6"/>
  <circle class="core" cx="50" cy="50" r="18" stroke-width="6"/>
  <circle class="dot" cx="50" cy="50" r="8"/>
