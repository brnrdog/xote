# XcodeGen project: `xcodegen generate` in this directory produces
# XoteNativeExample.xcodeproj. Nothing about the host needs XcodeGen — it is
# here so the repository does not have to carry a generated .xcodeproj.
name: XoteNativeExample
options:
  bundleIdPrefix: dev.xote
  # The oldest iOS this will install on. It is a floor, not a target: a newer
  # phone runs a build made with a lower floor perfectly well, so raise it only
  # to use an API that needs it. Nothing in the host does yet.
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  XoteNativeExample:
    type: application
    platform: iOS
    sources:
      - path: XoteNative/Sources
      - path: App
        excludes:
          - Info.plist
      # The bundle is shared with the Android host and built once, by
      # `npm run native:bundle`. Referencing the file rather than a directory
      # means there is no glob to be empty at generation time.
      - path: ../../bundle/dist/xote-app.js
        buildPhase: resources
    # XcodeGen *writes* this file rather than reading it, so every key the app
    # needs has to be declared here. `UILaunchScreen` is the one that matters:
    # without it iOS runs the app letterboxed at a legacy screen size, which
    # looks like a layout bug — black bands above and below, and a window that
    # will not fill the device.
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        # The dev server is plain HTTP on your machine, which App Transport
        # Security blocks by default — and blocks silently, so the app would
        # simply never draw. `NSAllowsLocalNetworking` permits localhost,
        # `.local` and link-local addresses and nothing else, which is exactly
        # the dev server and no part of the internet. A build with no
        # `XoteDevServer` configured never opens a connection anyway.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # iOS 14 and later ask before an app may talk to anything on the same
        # network, and a denied prompt looks exactly like a server that is not
        # running. On a simulator this never appears — it shares the Mac's
        # network stack rather than crossing one — so it is a prompt you only
        # meet the first time you run on a real phone.
        NSLocalNetworkUsageDescription:
          Connects to the Xote dev server on your computer, so this device can
          draw an app running there.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xote.native.example
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        # Running on a real phone needs a signing team, and `xcodegen
        # generate` writes this project from scratch every time — so a team
        # picked in Xcode's Signing & Capabilities tab survives until the next
        # generation and no longer. Put yours here to make it stick. It is the
        # ten-character Team ID from developer.apple.com → Membership, or from
        # the team's name in that tab.
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ABCDE12345

  XoteNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XoteNativeTests
      # The conformance suite is shared with the JavaScript hosts; the test
      # bundle carries a copy so it can be replayed against UIKit. Two levels
      # up, not one: this file lives in `hosts/ios/`, and `conformance/` is at
      # the root of the package.
      - path: ../../conformance/suite.json
        buildPhase: resources
    dependencies:
      - target: XoteNativeExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xote.native.example.tests
        GENERATE_INFOPLIST_FILE: YES
