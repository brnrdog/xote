name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The five-platform ppx binary matrix does NOT run here on every push: it
  # lives in ppx-binaries.yml, triggered by release.yml, by changes to
  # ppx/** or that workflow, and by a weekly drift-canary schedule. The test
  # job below still builds and e2e-tests the ppx on Linux each run.
  test:
    # Pinned (not -latest) so apt's OCaml stays 4.14, matching the compiler
    # ppx-binaries.yml pins for the shipped binaries. Bump both together.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: ReScript Build
        run: npm run res:build

      - name: Run tests
        run: node tests/Tests.res.mjs

      - name: Run JSX runtime tests
        run: node tests/JSXRuntime_test.mjs

      - name: Check public JS export surface
        run: npm run test:exports

      - name: Check public API boundary from a consumer package
        run: npm run test:boundary

      - name: Run dev-mode diagnostics tests
        run: node tests/DevMode_test.mjs

      # The @xote.component ppx (ppx/) ships in the npm package as prebuilt
      # binaries (see ppx-binaries.yml / release.yml). Build it from source
      # and run the example's jsdom verification here so the transform can't
      # rot; needs only ocamlopt (no opam).
      - name: Set up OCaml (for the @xote.component ppx)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox

      - name: Build & verify @xote.component ppx
        run: npm run ppx:test

      # The docs site is the only real *consumer* of the ppx in this repo — its
      # own rescript.json carries the ppx-flags and its sources are ordinary
      # @xote.component components, so this catches a broken consumer config or
      # a ppx regression the in-repo example cannot see. deploy-docs.yml runs
      # only on push to main, so before this step a malformed
      # docs-website/rescript.json passed PR CI green and broke after merge —
      # which is exactly how it reached this branch. Compiling 47 modules takes
      # about two seconds; the vite/SSR/prerender stages stay in deploy-docs.
      - name: Compile docs site through the ppx (real consumer)
        run: |
          cd docs-website
          npm install
          npm run res:build

      - name: Vite Build
        run: npm run build

      - name: Snapshot bundle size
        run: GITHUB_STEP_SUMMARY= npm run bundle:size -- --json bundle-size-current.json

      - name: Snapshot base bundle size
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"

          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }

          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"

          (
            cd "$base_dir"
            npm install
            npm run res:build
            npm run build
          )

          GITHUB_STEP_SUMMARY= node "$GITHUB_WORKSPACE/scripts/bundle-size-report.mjs" \
            --dist "$base_dir/dist" \
            --package "$base_dir/package.json" \
            --json bundle-size-base.json \
            --markdown /tmp/bundle-size-base-report.md

      - name: Generate bundle size report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f bundle-size-base.json ]; then
            npm run bundle:size -- \
              --json bundle-size-current.json \
              --baseline bundle-size-base.json \
              --baseline-label "$BASE_REF" \
              --current-label PR
          else
            npm run bundle:size -- --json bundle-size-current.json
          fi

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: bundle-size-report.md
        run: |
          marker="<!-- xote-bundle-size-report -->"
          body_file="$(mktemp)"

          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix benchmarks install

      - name: Install Chromium
        run: (cd benchmarks && npx playwright install --with-deps chromium)

      - name: Build PR benchmark app
        run: |
          npm run res:build
          node benchmarks/build.mjs --apps xote

      # The benchmark app source always comes from the PR so that both builds
      # run identical application code and only the library differs.
      - name: Build base benchmark app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"

          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }

          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"

          rm -rf "$base_dir/benchmarks"
          mkdir -p "$base_dir/benchmarks"
          cp -r benchmarks/apps benchmarks/shared benchmarks/build.mjs \
                benchmarks/driver.mjs benchmarks/dom-ops.mjs \
                benchmarks/package.json benchmarks/package-lock.json \
                "$base_dir/benchmarks/"
          find "$base_dir/benchmarks/apps" -name '*.res.mjs' -delete

          # The base commit may predate the benchmarks entry in rescript.json.
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            const dir = "benchmarks/apps/xote";
            if (!config.sources.some((source) => source.dir === dir)) {
              config.sources.push({ dir, subdirs: false, type: "dev" });
              fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
            }
          ' "$base_dir/rescript.json"

          (
            cd "$base_dir"
            npm install
            npm --prefix benchmarks install
            npx rescript
            node benchmarks/build.mjs --apps xote
          )

          rm -rf benchmarks/dist/xote-base
          cp -r "$base_dir/benchmarks/dist/xote" benchmarks/dist/xote-base

      - name: Run benchmark
        run: |
          node benchmarks/driver.mjs \
            --apps xote,xote-base \
            --iterations 10 \
            --warmup 3 \
            --out benchmarks/ci-results
          node benchmarks/dom-ops.mjs \
            --apps xote,xote-base \
            --json benchmarks/ci-results/dom-ops.json

      - name: Generate benchmark report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          node scripts/benchmark-report.mjs \
            --results benchmarks/ci-results/results.json \
            --dom-ops benchmarks/ci-results/dom-ops.json \
            --baseline-label "$BASE_REF" \
            --current-label PR

      - name: Comment benchmark on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: benchmark-report.md
        run: |
          marker="<!-- xote-benchmark-report -->"
          body_file="$(mktemp)"

          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi
