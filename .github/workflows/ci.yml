name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The five-platform ppx binary matrix does NOT run here on every push: it
  # lives in ppx-binaries.yml, triggered by release.yml, by changes to
  # ppx/** or that workflow, and by a weekly drift-canary schedule. The test
  # job below still builds and e2e-tests the ppx on Linux each run.
  test:
    # Pinned (not -latest) so apt's OCaml stays 4.14, matching the compiler
    # ppx-binaries.yml pins for the shipped binaries. Bump both together.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: ReScript Build
        run: npm run res:build

      # Run each package's own suite rather than a list of files. The list was
      # how `tests/OpaqueAttrs_test.mjs` came to exist without ever running
      # here: adding a test to the package and adding it to CI were two steps,
      # and only the first happened. One step per package means they cannot
      # drift again — `npm test` already chains the unit tests, the export
      # surface and the consumer boundary.
      - name: Test xote
        run: npm test

      # xote-native is a package with its own suites: the layout oracle against
      # Chromium-recorded frames, the host conformance suite, the type-surface
      # and protocol checks that read the Swift and Kotlin as text, and the
      # two-package install. None of it gated anything before this step existed.
      - name: Test xote-native
        run: npm run native:test

      # The shipped bundle in a realm with no DOM, no console, no timers and no
      # module loader — what an embedded JavaScript engine looks like before the
      # platform injects anything.
      - name: Test the native bundle in a bare realm
        run: npm run native:bundle:test

      # The @xote.component ppx (packages/xote/ppx/) ships in the npm package as prebuilt
      # binaries (see ppx-binaries.yml / release.yml). Build it from source
      # and run the example's jsdom verification here so the transform can't
      # rot; needs only ocamlopt (no opam).
      - name: Set up OCaml (for the @xote.component ppx)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox

      - name: Build & verify @xote.component ppx
        run: npm run ppx:test

      # The docs site is the only real *consumer* of the ppx in this repo — its
      # own rescript.json carries the ppx-flags and its sources are ordinary
      # @xote.component components, so this catches a broken consumer config or
      # a ppx regression the in-repo example cannot see. deploy-docs.yml runs
      # only on push to main, so before this step a malformed
      # docs-website/rescript.json passed PR CI green and broke after merge —
      # which is exactly how it reached this branch. Compiling 47 modules takes
      # about two seconds; the vite/SSR/prerender stages stay in deploy-docs.
      - name: Compile docs site through the ppx (real consumer)
        run: |
          cd docs-website
          npm install
          npm run res:build

      - name: Vite Build
        run: npm run build

      # Every file that crosses a step boundary is named absolutely. `bundle:size`
      # is a delegating alias, so it runs with the working directory set to
      # packages/xote, while the steps around it run at the workspace root — a
      # relative name means two different files depending on who wrote it.
      - name: Snapshot bundle size
        run: |
          GITHUB_STEP_SUMMARY= npm run bundle:size -- \
            --json "$GITHUB_WORKSPACE/bundle-size-current.json" \
            --markdown "$GITHUB_WORKSPACE/bundle-size-report.md"

      - name: Snapshot base bundle size
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"

          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }

          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"

          (
            cd "$base_dir"
            npm install
            npm run res:build
            npm run build
          )

          # The base commit may be from either layout. Before the monorepo
          # split `xote` was the repository root; after it the package is in
          # packages/xote, and so are its dist/ and package.json. The scripts
          # above are named the same in both (the root delegates), but these
          # two paths are not.
          if [ -f "$base_dir/packages/xote/package.json" ]; then
            base_pkg="$base_dir/packages/xote"
          else
            base_pkg="$base_dir"
          fi

          GITHUB_STEP_SUMMARY= node "$GITHUB_WORKSPACE/packages/xote/scripts/bundle-size-report.mjs" \
            --dist "$base_pkg/dist" \
            --package "$base_pkg/package.json" \
            --json "$GITHUB_WORKSPACE/bundle-size-base.json" \
            --markdown /tmp/bundle-size-base-report.md

      - name: Generate bundle size report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/bundle-size-base.json" ]; then
            npm run bundle:size -- \
              --json "$GITHUB_WORKSPACE/bundle-size-current.json" \
              --markdown "$GITHUB_WORKSPACE/bundle-size-report.md" \
              --baseline "$GITHUB_WORKSPACE/bundle-size-base.json" \
              --baseline-label "$BASE_REF" \
              --current-label PR
          else
            npm run bundle:size -- \
              --json "$GITHUB_WORKSPACE/bundle-size-current.json" \
              --markdown "$GITHUB_WORKSPACE/bundle-size-report.md"
          fi

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: bundle-size-report.md
        run: |
          marker="<!-- xote-bundle-size-report -->"
          body_file="$(mktemp)"

          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi
