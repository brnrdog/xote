name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Compile the @xote.component ppx for every platform the npm package ships
  # binaries for, so a breakage in any target surfaces before release.
  ppx-binaries:
    uses: ./.github/workflows/ppx-binaries.yml

  test:
    # Pinned (not -latest) so apt's OCaml stays 4.14, matching the compiler
    # ppx-binaries.yml pins for the shipped binaries. Bump both together.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: ReScript Build
        run: npm run res:build

      - name: Run tests
        run: node tests/Tests.res.mjs

      # The @xote.component ppx (ppx/) ships in the npm package as prebuilt
      # binaries (see ppx-binaries.yml / release.yml). Build it from source
      # and run the example's jsdom verification here so the transform can't
      # rot; needs only ocamlopt (no opam).
      - name: Set up OCaml (for the @xote.component ppx)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ocaml-nox

      - name: Build & verify @xote.component ppx
        run: npm run ppx:test

      - name: Vite Build
        run: npm run build

      - name: Snapshot bundle size
        run: GITHUB_STEP_SUMMARY= npm run bundle:size -- --json bundle-size-current.json

      - name: Snapshot base bundle size
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"

          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }

          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"

          (
            cd "$base_dir"
            npm install
            npm run res:build
            npm run build
          )

          GITHUB_STEP_SUMMARY= node "$GITHUB_WORKSPACE/scripts/bundle-size-report.mjs" \
            --dist "$base_dir/dist" \
            --package "$base_dir/package.json" \
            --json bundle-size-base.json \
            --markdown /tmp/bundle-size-base-report.md

      - name: Generate bundle size report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ -f bundle-size-base.json ]; then
            npm run bundle:size -- \
              --json bundle-size-current.json \
              --baseline bundle-size-base.json \
              --baseline-label "$BASE_REF" \
              --current-label PR
          else
            npm run bundle:size -- --json bundle-size-current.json
          fi

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: bundle-size-report.md
        run: |
          marker="<!-- xote-bundle-size-report -->"
          body_file="$(mktemp)"

          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi
