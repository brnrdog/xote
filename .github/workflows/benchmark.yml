name: Benchmark

# Opt-in via the `benchmark` label. The suite builds the library twice and
# drives a browser for several minutes, and its timings only mean anything for
# changes that touch rendering — so it stays off unless a PR asks for it.
#
# It lives outside ci.yml so that reacting to `labeled` does not re-run the
# whole test job every time any label is touched.

on:
  pull_request:
    branches: [main]
    # `labeled` is what lets an already-open PR opt in without a new push.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm --prefix benchmarks install

      - name: Install Chromium
        run: (cd benchmarks && npx playwright install --with-deps chromium)

      - name: Build PR benchmark app
        run: |
          npm run res:build
          node benchmarks/build.mjs --apps xote

      # The benchmark app source always comes from the PR so that both builds
      # run identical application code and only the library differs.
      - name: Build base benchmark app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$(mktemp -d)"

          cleanup() {
            git worktree remove "$base_dir" --force || true
            rm -rf "$base_dir"
          }

          trap cleanup EXIT

          git worktree add --detach "$base_dir" "$BASE_SHA"

          rm -rf "$base_dir/benchmarks"
          mkdir -p "$base_dir/benchmarks"
          cp -r benchmarks/apps benchmarks/shared benchmarks/build.mjs \
                benchmarks/driver.mjs benchmarks/dom-ops.mjs \
                benchmarks/package.json benchmarks/package-lock.json \
                "$base_dir/benchmarks/"
          find "$base_dir/benchmarks/apps" -name '*.res.mjs' -delete

          # The base commit may predate the benchmarks entry in rescript.json.
          node -e '
            const fs = require("node:fs");
            const file = process.argv[1];
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            const dir = "benchmarks/apps/xote";
            if (!config.sources.some((source) => source.dir === dir)) {
              config.sources.push({ dir, subdirs: false, type: "dev" });
              fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
            }
          ' "$base_dir/rescript.json"

          (
            cd "$base_dir"
            npm install
            npm --prefix benchmarks install
            npx rescript
            node benchmarks/build.mjs --apps xote
          )

          rm -rf benchmarks/dist/xote-base
          cp -r "$base_dir/benchmarks/dist/xote" benchmarks/dist/xote-base

      - name: Run benchmark
        run: |
          node benchmarks/driver.mjs \
            --apps xote,xote-base \
            --iterations 10 \
            --warmup 3 \
            --out benchmarks/ci-results
          node benchmarks/dom-ops.mjs \
            --apps xote,xote-base \
            --json benchmarks/ci-results/dom-ops.json

      - name: Generate benchmark report
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          node scripts/benchmark-report.mjs \
            --results benchmarks/ci-results/results.json \
            --dom-ops benchmarks/ci-results/dom-ops.json \
            --baseline-label "$BASE_REF" \
            --current-label PR

      - name: Comment benchmark on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_FILE: benchmark-report.md
        run: |
          marker="<!-- xote-benchmark-report -->"
          body_file="$(mktemp)"

          {
            echo "$marker"
            cat "$COMMENT_FILE"
          } > "$body_file"

          comment_id="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$marker\")) | .id" \
              | head -n 1
          )"

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" \
              -f body="$(cat "$body_file")"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body="$(cat "$body_file")"
          fi
